<style>

<body>

<script>

 c.v=Math.round((rnd()-.5)*8+6*Math.sin(i*.5+1)*Math.cos(j*.42)+2*((Eh(i-1,j)+Eh(i,j-1))-(Eh(i+1,j)+Eh(i,j+1))));c.d=rnd();

  else if(c.b){if(c.b=="puerto"&&c.pd&&(c.pd[0]<0||c.pd[1]<0)){pier(i,j,c);ol=true}building(x,y,c.b,c);if(c.pr)pbar(x,y,c);if(selB&&selB.i==i&&selB.j==j)bring(x,y)}

  A.forEach(a=>{if(!a.alive&&a.dd>=.8)return;const p=pos(a);if(Math.round(p[0])==i&&Math.round(p[1])==j)animal(a)});

 for(let i=0;i<N;i++)for(let j=0;j<N;j++){const c=grid[i][j];if(c.w){const x=(i-j)*TW,y=(i+j)*TH-c.e*EH;if(vis(x,y))foam(dia(x,y,1,0),i,j)}else if(c.b=="puerto"&&c.pd&&(c.pd[0]>0||c.pd[1]>0))pier(i,j,c)}

const nearSea=(i,j)=>D4.some(d=>{const q=grid[i+d[0]]&&grid[i+d[0]][j+d[1]];return q&&q.sea});
const hc=(i,j)=>{if(tool=="demoler"||tool=="sel")return"#ffd36b";const c=grid[i][j];return c.w||c.b||gold<T[tool].c||occ(i,j)||(tool=="puerto"&&!nearSea(i,j))||(tool=="mina"&&(c.e<2||!D8.some(d=>walk(i+d[0],j+d[1]))))?"#ef6a52":"#9be37a"};
function panel(){const c=selB&&grid[selB.i][selB.j],d=c&&c.b&&PR[c.b];if(!d){pn.style.display="none";return}
 pn.style.display="flex";pt.innerHTML=ICON[c.b]+T[c.b].n;
 pb.textContent=c.pr?"Produciendo… "+Math.floor(c.pr.t/c.pr.time*100)+"%":"Producir "+d.n.toLowerCase()+" ("+d.food+" comida)";
 pb.style.setProperty("--p",c.pr?Math.floor(c.pr.t/c.pr.time*100)+"%":"100%");pb.disabled=!!c.pr||food<d.food||U.length+PB.length>=10}
pb.onclick=()=>{if(!selB)return;const c=grid[selB.i][selB.j],d=PR[c.b];if(!d||c.pr)return;
 if(U.length+PB.length>=10)return say("Máximo 10 aldeanos");if(food<d.food)return say("Necesitas "+d.food+" de comida");
 food-=d.food;c.pr={i:selB.i,j:selB.j,t:0,k:d.k,time:d.time};PB.push(c.pr);hud();panel()};
function selAct(p,c){
 const hit=U.find(u=>{const q=pos(u);return Math.round(q[0])==p[0]&&Math.round(q[1])==p[1]}),cur=U.find(u=>u.sel);
 if(hit){selB=null;panel();U.forEach(u=>u.sel=u==hit);say("Toca un árbol, una roca, el puerto, la mina o un animal");return}
 const an=A.filter(a=>a.alive).map(a=>{let d;if(lastW){const s=sxy(a);d=Math.hypot((lastW[0]-s[0])/30,(lastW[1]-(s[1]-12))/26)}else{const q=pos(a);d=Math.hypot(q[0]-p[0],q[1]-p[1])}return[a,d]}).filter(x=>x[1]<1).sort((x,y)=>x[0]===y[0]?0:x[1]-y[1]).map(x=>x[0])[0];
 if(an){if(!cur){selB=null;panel();say("Selecciona un aldeano y toca el animal para cazarlo");return}
  const path=route(cur,adj(an.ti,an.tj));if(!path){say("No puede llegar hasta el animal");return}
  cur.dep=0;an.hunted=1;cur.job={i:an.ti,j:an.tj,k:"hunt",a:an};cur.path=path;cur.work=0;say("¡A cazar!");return}
 if(PR[c.b]){selB={i:p[0],j:p[1]};U.forEach(u=>u.sel=false);panel();return}
 if(c.b=="almacen"){say("Los aldeanos dejan aquí lo que recolectan");return}
 if(!cur){selB=null;panel();if(c.b=="puerto")say("Selecciona una tropa y toca el puerto para pescar");if(c.b=="mina")say("Selecciona una tropa y toca la mina para extraer oro");return}
 if(c.tree||c.rock||c.b=="puerto"||c.b=="mina"){cur.dep=0;const path=route(cur,adj(p[0],p[1]));if(!path)return say("No puede llegar hasta ahí");
  cur.job={i:p[0],j:p[1],k:c.tree?"tree":c.rock?"rock":c.b=="mina"?"mine":"port",pd:c.pd};cur.path=path;cur.work=0;return}
 if(walk(p[0],p[1])){const path=route(cur,at(p[0],p[1]));if(path){cur.dep=0;cur.job=null;cur.dest=p;cur.path=path;cur.work=0;return}}
 U.forEach(u=>u.sel=false)}
let lastW=null;
function pick(e){const r=cv.getBoundingClientRect(),wx=(e.clientX-r.left-ox)/z,wy=(e.clientY-r.top-oy)/z;lastW=[wx,wy];
 for(let i=N-1;i>=0;i--)for(let j=N-1;j>=0;j--){const y=(i+j)*TH-grid[i][j].e*EH;
  if(Math.abs(wx-(i-j)*TW)/TW+Math.abs(wy-y)/TH<=1)return[i,j]}
 return null}
function act(p){if(!p)return;const c=grid[p[0]][p[1]];if(tool=="sel")return selAct(p,c);
 if(tool=="demoler"){if(c.b){gold+=T[c.b].c/2;c.b=null;if(c.pr){PB.splice(PB.indexOf(c.pr),1);c.pr=null}selB=null;panel()}else if(c.tree||c.rock){c.tree=c.rock=false}return}
 if(c.w||c.b||occ(p[0],p[1]))return say("Ese terreno está ocupado");
 if(tool=="puerto"&&!nearSea(p[0],p[1]))return say("El puerto debe construirse junto al mar");
 if(tool=="mina"&&c.e<2)return say("La mina debe construirse en una colina");
 if(tool=="mina"&&!D8.some(d=>walk(p[0]+d[0],p[1]+d[1])))return say("No hay acceso a esa casilla");
 if(gold<T[tool].c)return say("Te falta oro");
 gold-=T[tool].c;c.tree=c.rock=c.bush=false;c.b=tool;
 if(tool=="puerto")c.pd=D4.find(d=>{const q=grid[p[0]+d[0]]&&grid[p[0]+d[0]][p[1]+d[1]];return q&&q.sea});
 hud();if(tool!="camino")setTool("sel")}
const ZMIN=.2,ZMAX=2.2,zdef=()=>VW<700||VH<420?.5:VW<1100?.8:1;
function zoomAt(f,cx,cy){const nz=Math.min(ZMAX,Math.max(ZMIN,z*f));ox=cx-(cx-ox)*nz/z;oy=cy-(cy-oy)*nz/z;z=nz}
function centrar(){let si=0,sj=0,n=0;for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(grid[i][j].b){si+=i;sj+=j;n++}
 const ci=n?si/n:N/2,cj=n?sj/n:N/2,g=grid[Math.round(ci)]&&grid[Math.round(ci)][Math.round(cj)];z=zdef();ox=VW/2-(ci-cj)*TW*z;oy=VH/2-((ci+cj)*TH-(g?g.e*EH:0))*z}
zi.onclick=()=>zoomAt(1.3,VW/2,VH/2);zo.onclick=()=>zoomAt(1/1.3,VW/2,VH/2);zf.onclick=centrar;
const ptr=new Map();let drag=null,pinch=null,moved=false;
cv.onpointerdown=e=>{try{cv.setPointerCapture(e.pointerId)}catch(er){}
 if(e.pointerType=="mouse")ptr.clear();ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size==1){drag={x:e.clientX,y:e.clientY,ox,oy,m:0};moved=false}
 else if(ptr.size==2){drag=null;moved=true;const [a,b]=[...ptr.values()],r=cv.getBoundingClientRect(),cx=(a.x+b.x)/2-r.left,cy=(a.y+b.y)/2-r.top;pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:z,wx:(cx-ox)/z,wy:(cy-oy)/z}}};
cv.onpointermove=e=>{if(ptr.has(e.pointerId))ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&ptr.size>=2){const [a,b]=[...ptr.values()],r=cv.getBoundingClientRect(),cx=(a.x+b.x)/2-r.left,cy=(a.y+b.y)/2-r.top,d=Math.hypot(a.x-b.x,a.y-b.y)||1;z=Math.min(ZMAX,Math.max(ZMIN,pinch.z0*d/pinch.d0));ox=cx-pinch.wx*z;oy=cy-pinch.wy*z;return}
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>(e.pointerType=="touch"?9:5))drag.m=1;if(drag.m){ox=drag.ox+dx;oy=drag.oy+dy}}

function endPtr(e,tap){ptr.delete(e.pointerId);
 if(pinch&&ptr.size<2){pinch=null;const rest=[...ptr.values()][0];drag=rest?{x:rest.x,y:rest.y,ox,oy,m:1}:null;return}
 if(tap&&drag&&!drag.m&&!moved)act(pick(e));if(ptr.size==0)drag=null}
cv.onpointerup=e=>endPtr(e,true);cv.onpointercancel=e=>endPtr(e,false);
cv.onwheel=e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.deltaY<0?1.1:.9,e.clientX-r.left,e.clientY-r.top)};

["vaca","vaca","vaca","oveja","oveja","oveja"].forEach(k=>{let i,j;do{i=Math.floor(N/2-11+rnd()*22);j=Math.floor(N/2-11+rnd()*22)}while(!walk(i,j)||occ(i,j));A.push(mkEnt(i,j,{k,sp:k=="vaca"?.55:.8,st:"idle",tm:Math.random()*3,gz:0,alive:true,hi:i,hj:j,rz:0,dd:9,ra:9,hunted:0}))});
const KEY="imperio_save_v6";

function save(quiet){if(noSave)return;try{const d={n:kn.value,g:gold,f:food,w:wood,s:stone,rt:rtimer,bd:[],tr:[],rk:[],pr:PB.map(p=>[p.i,p.j,p.t,p.k,p.time]),an:A.map(a=>[a.i,a.j,a.alive?1:0,Math.round(a.rz)]),un:U.map(u=>[u.i,u.j,u.k,u.carry])};
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){const c=grid[i][j];if(c.b)d.bd.push([i,j,c.b,c.pd||0]);if(c.tree)d.tr.push([i,j]);if(c.rock)d.rk.push([i,j])}
 localStorage.setItem(KEY,JSON.stringify(d));if(!quiet)flash("Guardado ✓")}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(!r)return;const d=JSON.parse(r);
 grid.flat().forEach(c=>{c.tree=c.rock=false;c.b=null;c.pr=null});

 d.an.forEach((q,k)=>{const a=A[k];if(!a)return;if(q[2]===0){a.alive=false;a.dd=9;a.rz=q[3]||180;return}if(walk(q[0],q[1])){a.i=a.ti=q[0];a.j=a.tj=q[1]}});
