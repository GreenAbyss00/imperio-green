<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imperio isométrico</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d6fb8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ft:"Lilita One","Trebuchet MS",Georgia,sans-serif;--fc:Cinzel,"Palatino Linotype",Georgia,serif}
html,body{height:100%;margin:0}
body{background:var(--bg);color:#fff;font-family:var(--ft);display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:6px 10px 8px;background:linear-gradient(#7a4d27,#4e3018);border-bottom:4px solid #2b190b;box-shadow:0 3px 8px rgba(0,0,0,.45);position:relative;z-index:2;flex-wrap:wrap}
.plate{position:relative;display:flex;align-items:center;gap:8px;background:linear-gradient(#5e3b1b,#3a2312);border:3px solid #e3b94a;border-radius:12px 12px 26px 12px;padding:4px 22px 4px 10px;box-shadow:inset 0 0 0 2px #24140a,0 2px 6px rgba(0,0,0,.5)}
.plate::after{content:"";position:absolute;left:-7px;bottom:-7px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e9b8ff,#8a3fc9 60%,#4a1a78);border:2px solid #e3b94a}
.crown svg{width:40px;height:40px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.5))}.crown{display:flex}
#kn{background:transparent;border:0;border-bottom:2px dashed transparent;color:#f7c948;font:900 28px var(--fc);letter-spacing:.5px;text-shadow:0 2px 0 #7a4b0a,0 0 10px rgba(255,200,60,.35);padding:0 2px;outline:0;min-width:90px}
#kn:hover,#kn:focus{border-bottom-color:rgba(247,201,72,.7)}
#sv{font:12px var(--ft);color:#bfe3a0;opacity:0;transition:opacity .4s}
.rbar{flex:1;min-width:260px;display:flex;align-items:center;gap:12px 10px;flex-wrap:wrap;background:linear-gradient(#a9aeb3,#70767c);border:3px solid #3e4247;border-radius:14px;padding:7px 16px 7px 10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.5)}
.chest{display:flex;width:56px;height:46px}.chest svg{width:100%;height:100%;filter:drop-shadow(0 2px 1px rgba(0,0,0,.5))}
.pill{position:relative;display:flex;align-items:center;min-width:34px;height:34px;background:linear-gradient(#383c41,#202327);border:2px solid #121417;border-radius:999px;padding:0 14px 0 46px;color:#fff;font:400 21px var(--ft);box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
.pill i{position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:46px;height:46px;display:flex}
.pill svg{width:100%;height:100%;filter:drop-shadow(0 2px 1px rgba(0,0,0,.55))}
.pill.up{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.12);filter:brightness(1.5)}}
@media (prefers-reduced-motion:reduce){.pill.up{animation:none}}
#rs{position:relative;background:linear-gradient(#f7d067,#cf9420);border:3px solid #7a4b0a;border-radius:12px;padding:12px 30px;font:900 17px var(--fc);color:#4a2a05;cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 3px 0 #5a3508,0 5px 8px rgba(0,0,0,.5);text-shadow:0 1px 0 rgba(255,255,255,.45)}
#rs::before,#rs::after{content:"";position:absolute;width:24px;height:16px;background:linear-gradient(#5fc23a,#2f8a22);border:2px solid #1c561a;border-radius:100% 0}
#rs::before{left:-14px;bottom:-8px;transform:rotate(200deg)}#rs::after{right:-12px;top:-9px;transform:rotate(-25deg)}
#rs:focus-visible{outline:2px solid #fff}
#c{flex:1;min-height:0;width:100%;display:block;touch-action:none;cursor:grab;background:#1d6fb8}
.tools{position:relative;z-index:2;padding:12px 10px 10px;background:repeating-linear-gradient(90deg,#8a5429 0 58px,#6b3f1b 58px 61px),#7b4a22;border-top:5px solid #3a2312;box-shadow:0 -3px 8px rgba(0,0,0,.4)}
.dock{max-width:1190px;margin:0 auto;background:linear-gradient(#a8662f,#7d4a22);border:5px solid #8f959b;border-radius:16px;box-shadow:inset 0 0 0 3px #3a3f44,0 4px 10px rgba(0,0,0,.55);padding:12px 16px 10px;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden}
.dock::-webkit-scrollbar{height:6px}.dock::-webkit-scrollbar-thumb{background:#5a3508;border-radius:3px}
.dock .card:first-child{margin-left:auto}.dock .card:last-child{margin-right:auto}
.lf{position:absolute;width:48px;height:48px;top:-26px;z-index:3;pointer-events:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.5))}
.lf.l{left:calc(50% - 610px)}.lf.r{right:calc(50% - 610px);transform:scaleX(-1)}
@media (max-width:1250px){.lf.l{left:0}.lf.r{right:0}}
.card{flex:none;width:98px;display:flex;flex-direction:column;align-items:center;border:4px solid var(--bd);border-radius:14px;background:linear-gradient(var(--c1),var(--c2));padding:0 0 5px;position:relative;cursor:pointer;color:#fff;font:400 15px var(--ft);box-shadow:inset 0 0 0 2px rgba(0,0,0,.45),0 3px 0 rgba(0,0,0,.5);transition:transform .12s}
.card:hover{transform:translateY(-3px)}
.card.on{transform:translateY(-7px) scale(1.05);box-shadow:inset 0 0 0 2px rgba(0,0,0,.45),0 0 0 3px #fff3b0,0 0 18px 5px rgba(255,230,120,.85)}
.card.no{filter:saturate(.4) brightness(.78)}
.card:focus-visible{outline:3px solid #fff}
.cd-ic{width:100%;height:66px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 62%,rgba(255,255,255,.34),rgba(255,255,255,0) 70%);border-radius:9px 9px 0 0}
.cd-ic svg{width:64px;height:64px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
.cd-nm{min-height:32px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;padding:0 3px;text-shadow:0 2px 0 rgba(0,0,0,.7),0 0 3px rgba(0,0,0,.6)}
.cd-co{display:flex;align-items:center;gap:3px;font-size:14px;color:#ffe9a3;text-shadow:0 1px 0 rgba(0,0,0,.7)}
.cd-co svg{width:16px;height:16px}
.k-casa{--c1:#e2693c;--c2:#a53a1c;--bd:#d9542e}.k-granja{--c1:#6cc04a;--c2:#2f8a2c;--bd:#4aa83a}.k-cuartel{--c1:#a45ad8;--c2:#5f2a96;--bd:#8d3fc9}
.k-camino{--c1:#b27a47;--c2:#6b4423;--bd:#9a6a3b}.k-camp{--c1:#b8803f;--c2:#6e4520;--bd:#a8723c}.k-vikinga{--c1:#6cc04a;--c2:#2c7a2a;--bd:#4aa83a}
.k-almacen{--c1:#3cc4b0;--c2:#1b7f78;--bd:#27a898}.k-puerto{--c1:#4aa8ef;--c2:#1e62b8;--bd:#2f8fdc}.k-mina{--c1:#f5bf3a;--c2:#c27a10;--bd:#e8a31f}.k-demoler{--c1:#e5483d;--c2:#9a1f1a;--bd:#d6382f}
#msg{position:absolute;left:50%;top:92px;transform:translateX(-50%);background:linear-gradient(#5e3b1b,#3a2312);border:2px solid #e3b94a;padding:7px 14px;border-radius:10px;font:400 16px var(--ft);opacity:0;transition:opacity .2s;pointer-events:none;z-index:3;text-align:center;max-width:90vw}
#hint{position:fixed;left:50%;bottom:calc(172px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(58,35,18,.92);color:#fff;border:2px solid #e3b94a;border-radius:999px;padding:6px 16px;font:400 15px var(--ft);display:none;max-width:92vw;text-align:center;pointer-events:none;z-index:3}
#pn{position:fixed;left:12px;top:96px;background:linear-gradient(#7b4720,#4e2d14);border:3px solid #e3b94a;border-radius:14px;padding:10px 12px;display:none;gap:12px;align-items:center;font:400 18px var(--ft);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.5),inset 0 0 0 2px #24140a;z-index:3}
#pt svg{width:30px;height:30px;vertical-align:-8px;margin-right:6px}
#pn button{background:linear-gradient(90deg,#f0b93a var(--p,100%),#5a4a38 var(--p,100%));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);border:2px solid #7a4b0a;border-radius:9px;padding:8px 14px;font:400 16px var(--ft);cursor:pointer}
#pn button:disabled{opacity:.7;cursor:default}
#pn button:focus-visible{outline:2px solid #fff}
@media (max-width:760px){
.top{gap:6px;padding:4px 6px 6px}.plate{order:1;flex:1;padding:2px 14px 2px 8px}.crown svg{width:30px;height:30px}#kn{font-size:20px;min-width:60px}
#rs{order:2;padding:8px 14px;font-size:13px}.rbar{order:3;flex:1 0 100%;min-width:0;gap:8px 8px;padding:6px 8px 6px 14px}
.chest{display:none}.pill{height:26px;min-width:24px;font-size:16px;padding:0 8px 0 32px}.pill i{width:34px;height:34px;left:-9px}
.card{width:88px}.cd-ic{height:56px}.cd-ic svg{width:54px;height:54px}.tools{padding:10px 6px 8px}.dock{padding:10px 8px 8px}#hint{bottom:calc(150px + env(safe-area-inset-bottom,0px))}}
</style></head>
<body>

 pn.style.display="flex";pt.innerHTML=ICON[c.b]+T[c.b].n;
 pb.textContent=c.pr?"Produciendo… "+Math.floor(c.pr.t/c.pr.time*100)+"%":"Producir "+d.n.toLowerCase()+" ("+d.food+" comida)";
 pb.style.setProperty("--p",c.pr?Math.floor(c.pr.t/c.pr.time*100)+"%":"100%");pb.disabled=!!c.pr||food<d.food||U.length+PB.length>=10}
pb.onclick=()=>{if(!selB)return;const c=grid[selB.i][selB.j],d=PR[c.b];if(!d||c.pr)return;
 if(U.length+PB.length>=10)return say("Máximo 10 aldeanos");if(food<d.food)return say("Necesitas "+d.food+" de comida");
 food-=d.food;c.pr={i:selB.i,j:selB.j,t:0,k:d.k,time:d.time};PB.push(c.pr);hud();panel()};
function selAct(p,c){
 const hit=U.find(u=>{const q=pos(u);return Math.round(q[0])==p[0]&&Math.round(q[1])==p[1]}),cur=U.find(u=>u.sel);
 if(hit){selB=null;panel();U.forEach(u=>u.sel=u==hit);say("Toca un árbol, una roca, el puerto, la mina o un animal");return}
 const an=A.filter(a=>a.alive).map(a=>{const q=pos(a);return[a,Math.hypot(q[0]-p[0],q[1]-p[1])]}).filter(x=>x[1]<.8).sort((x,y)=>x[1]-y[1]).map(x=>x[0])[0];
 if(an){if(!cur){selB=null;panel();say("Selecciona un aldeano y toca el animal para cazarlo");return}
  const path=bfs(cur.ti,cur.tj,adj(an.ti,an.tj));if(!path){say("No puede llegar hasta el animal");return}
  cur.dep=0;an.hunted=1;cur.job={i:an.ti,j:an.tj,k:"hunt",a:an};cur.path=path;cur.work=0;say("¡A cazar!");return}
 if(PR[c.b]){selB={i:p[0],j:p[1]};U.forEach(u=>u.sel=false);panel();return}
 if(c.b=="almacen"){say("Los aldeanos dejan aquí lo que recolectan");return}
 if(!cur){selB=null;panel();if(c.b=="puerto")say("Selecciona una tropa y toca el puerto para pescar");if(c.b=="mina")say("Selecciona una tropa y toca la mina para extraer oro");return}
 if(c.tree||c.rock||c.b=="puerto"||c.b=="mina"){cur.dep=0;const path=bfs(cur.ti,cur.tj,adj(p[0],p[1]));if(!path)return say("No puede llegar hasta ahí");
  cur.job={i:p[0],j:p[1],k:c.tree?"tree":c.rock?"rock":c.b=="mina"?"mine":"port",pd:c.pd};cur.path=path;cur.work=0;return}
 if(walk(p[0],p[1])){const path=bfs(cur.ti,cur.tj,at(p[0],p[1]));if(path){cur.dep=0;cur.job=null;cur.path=path;cur.work=0;return}}
 U.forEach(u=>u.sel=false)}
function pick(e){const r=cv.getBoundingClientRect(),wx=(e.clientX-r.left-ox)/z,wy=(e.clientY-r.top-oy)/z;
 for(let i=N-1;i>=0;i--)for(let j=N-1;j>=0;j--){const y=(i+j)*TH-grid[i][j].e*EH;
  if(Math.abs(wx-(i-j)*TW)/TW+Math.abs(wy-y)/TH<=1)return[i,j]}
 return null}
function act(p){if(!p)return;const c=grid[p[0]][p[1]];if(tool=="sel")return selAct(p,c);
 if(tool=="demoler"){if(c.b){gold+=T[c.b].c/2;c.b=null;if(c.pr){PB.splice(PB.indexOf(c.pr),1);c.pr=null}selB=null;panel()}else if(c.tree||c.rock){c.tree=c.rock=false}return}
 if(c.w||c.b||occ(p[0],p[1]))return say("Ese terreno está ocupado");
 if(tool=="puerto"&&!nearSea(p[0],p[1]))return say("El puerto debe construirse junto al mar");
 if(tool=="mina"&&c.e<2)return say("La mina debe construirse en una colina");
 if(tool=="mina"&&!D8.some(d=>walk(p[0]+d[0],p[1]+d[1])))return say("No hay acceso a esa casilla");
 if(gold<T[tool].c)return say("Te falta oro");
 gold-=T[tool].c;c.tree=c.rock=c.bush=false;c.b=tool;
 if(tool=="puerto")c.pd=D4.find(d=>{const q=grid[p[0]+d[0]]&&grid[p[0]+d[0]][p[1]+d[1]];return q&&q.sea});
 hud();if(tool!="camino")setTool("sel")}
let drag=null;
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,ox,oy,m:0}};
cv.onpointermove=e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.m=1;if(drag.m){ox=drag.ox+dx;oy=drag.oy+dy}}hover=pick(e)};
cv.onpointerup=e=>{if(drag&&!drag.m)act(pick(e));drag=null};
cv.onwheel=e=>{e.preventDefault();const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,nz=Math.min(2,Math.max(.22,z*(e.deltaY<0?1.1:.9)));ox=mx-(mx-ox)*nz/z;oy=my-(my-oy)*nz/z;z=nz};
/* ---------- inicio, guardado ---------- */
["vaca","vaca","vaca","oveja","oveja","oveja"].forEach(k=>{let i,j;do{i=Math.floor(rnd()*N);j=Math.floor(rnd()*N)}while(!walk(i,j)||occ(i,j));A.push(mkEnt(i,j,{k,sp:k=="vaca"?.55:.8,st:"idle",tm:Math.random()*3,gz:0,alive:true,hi:i,hj:j,rz:0,dd:9,ra:9,hunted:0}))});
const KEY="imperio_save_v5";
function flash(m){sv.textContent=m;sv.style.opacity=1;clearTimeout(flash.t);flash.t=setTimeout(()=>sv.style.opacity=0,1600)}
function save(quiet){if(noSave)return;try{const d={n:kn.value,g:gold,f:food,w:wood,s:stone,rt:rtimer,bd:[],tr:[],rk:[],pr:PB.map(p=>[p.i,p.j,p.t,p.k,p.time]),an:A.map(a=>[a.i,a.j,a.alive?1:0,Math.round(a.rz)]),un:U.map(u=>[u.i,u.j,u.k,u.carry])};
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){const c=grid[i][j];if(c.b)d.bd.push([i,j,c.b,c.pd||0]);if(c.tree)d.tr.push([i,j]);if(c.rock)d.rk.push([i,j])}
 localStorage.setItem(KEY,JSON.stringify(d));if(!quiet)flash("Guardado ✓")}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(!r)return;const d=JSON.parse(r);
 grid.flat().forEach(c=>{c.tree=c.rock=false;c.b=null;c.pr=null});
 d.tr.forEach(p=>grid[p[0]][p[1]].tree=true);d.rk.forEach(p=>grid[p[0]][p[1]].rock=true);
 d.bd.forEach(p=>{const c=grid[p[0]][p[1]];c.b=p[2];if(p[3])c.pd=p[3]});
 gold=d.g;food=d.f;wood=d.w;stone=d.s;rtimer=d.rt||300;kn.value=d.n||"GreenAbyss";kn.size=Math.max(6,kn.value.length+1);
 d.pr.forEach(p=>{const c=grid[p[0]][p[1]];if(c.b&&PR[c.b]){const it={i:p[0],j:p[1],t:p[2],k:p[3],time:p[4]};c.pr=it;PB.push(it)}});
 d.an.forEach((q,k)=>{const a=A[k];if(!a)return;if(q[2]===0){a.alive=false;a.dd=9;a.rz=q[3]||180;return}if(walk(q[0],q[1])){a.i=a.ti=q[0];a.j=a.tj=q[1]}});
 d.un.forEach(q=>{if(walk(q[0],q[1]))U.push(mkUnit(q[0],q[1],q[2],q[3]))})}catch(e){}}
rs.onclick=()=>{if(!rs.dataset.s){rs.dataset.s=1;rs.textContent="¿Seguro?";setTimeout(()=>{delete rs.dataset.s;rs.textContent="Nueva partida"},3000)}
 else{noSave=true;try{localStorage.removeItem(KEY)}catch(e){}location.reload()}};
load();hud();
setInterval(save,10000);addEventListener("beforeunload",()=>save(1));document.addEventListener("visibilitychange",()=>{if(document.hidden)save(1)});
let last=performance.now();
(function loop(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;TT=now;try{updU(dt);draw()}catch(er){say("Error: "+er.message)}requestAnimationFrame(loop)})(performance.now());
</script></body></html>
